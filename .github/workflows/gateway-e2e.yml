name: OpenViking Gateway kind acceptance
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit for the A/B diagnostic"
        required: true
        default: c667b57b40d56e704241dc7400e332e7e0f77b55
      overlay:
        description: "Build the selected ref over the release image"
        type: boolean
        default: true
      base_ref:
        description: "Release tag for the A/B diagnostic"
        required: true
        default: v0.5.2
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OV_TEST_GATEWAY_IMAGE: ghcr.io/volcengine/openviking:main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Verify diagnostic inputs
        id: diagnostic_inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TEST_REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base_ref }}
          OVERLAY: ${{ inputs.overlay }}
        run: |
          if [[ "$TEST_REF" != c667b57b40d56e704241dc7400e332e7e0f77b55 || "$BASE_REF" != v0.5.2 || "$OVERLAY" != true ]]; then
            echo 'This diagnostic requires ref=c667b57b4, overlay=true and base_ref=v0.5.2' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TEST_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test clients and kind
        run: |
          echo "OV_TEST_KIND_KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          pip install pytest httpx openai==3.37.0 anthropic==2.2.0
          npm install --global @openai/codex@0.146.0
          mkdir -p "$RUNNER_TEMP/kind-bin"
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind-bin/kind"
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
          mkdir -p artifacts
      - name: Create dedicated three-node cluster
        run: kind create cluster --name ovgw-e2e --config tests/gateway/e2e/kind.yaml --kubeconfig "$OV_TEST_KIND_KUBECONFIG" --wait 120s
      - name: Capture runner baseline
        if: github.event_name == 'workflow_dispatch' && inputs.overlay
        shell: bash
        run: |
          command -v timeout setsid
          diag="$RUNNER_TEMP/ovgw-runner-diagnostics"
          mkdir -p "$diag"
          cat > "$diag/snapshot.sh" <<'SNAPSHOT'
          #!/usr/bin/env bash
          set -u
          probe() {
            printf '\nprobe:'; printf ' %q' "$@"; printf '\n'
            timeout --kill-after=1s 5s "$@"
            printf 'probe_exit=%s\n' "$?"
          }
          printf 'utc=%s\n' "$(date -u +%FT%TZ)"
          docker_root=$(cat "${BASH_SOURCE[0]%/*}/docker-root.txt")
          probe grep -E '^(MemAvailable|SwapFree):' /proc/meminfo
          probe cat /proc/loadavg
          for resource in cpu memory io; do probe cat "/proc/pressure/$resource"; done
          probe grep '^oom_kill ' /proc/vmstat
          probe df -Pk -- / "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "${docker_root:-/}"
          probe df -Pi -- / "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "${docker_root:-/}"
          probe ps -C Runner.Listener,Runner.Worker,dockerd,containerd,buildkitd -o pid,comm,rss,stat,pcpu
          if [[ ${1:-} == full ]]; then
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
            probe uname -r
            probe nproc
            probe docker version --format '{{.Client.Version}} {{.Server.Version}}'
            probe docker buildx version
            probe docker info --format 'driver={{.Driver}} root={{.DockerRootDir}}'
            probe docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} memory={{.MemUsage}}' ovgw-e2e-control-plane ovgw-e2e-worker ovgw-e2e-worker2
            probe bash -o pipefail -c "dmesg --ctime | grep -Ei 'out of memory|killed process|oom|I/O error|no space left'"
          fi
          SNAPSHOT
          root_status=0
          timeout --kill-after=1s 5s docker info --format '{{.DockerRootDir}}' > "$diag/docker-root.txt" 2> "$diag/docker-root-probe.txt" || root_status=$?
          printf 'docker_root_probe_exit=%s\n' "$root_status" > "$diag/runner-baseline.txt"
          cat "$diag/docker-root-probe.txt" >> "$diag/runner-baseline.txt"
          bash "$diag/snapshot.sh" full >> "$diag/runner-baseline.txt" 2>&1
          cat "$diag/runner-baseline.txt"
          cat > "$diag/run-overlay.sh" <<'BUILD'
          #!/usr/bin/env bash
          set -euo pipefail
          phase=$1
          case "$phase" in
            no-export) no_load=1 ;;
            export) no_load=0 ;;
            *) exit 2 ;;
          esac
          diag="$RUNNER_TEMP/ovgw-runner-diagnostics"
          snapshot="$diag/snapshot.sh"
          image_absent() {
            local image
            image=$(timeout --kill-after=1s 5s docker image ls --format '{{.Repository}}:{{.Tag}}' ovgw-e2e:local) || return "$?"
            if [[ -n "$image" ]]; then
              echo 'Expected ovgw-e2e:local to be absent during phase A' >&2
              return 1
            fi
          }
          run_build() {
            if [[ "$phase" == no-export ]]; then image_absent || return "$?"; fi
            env BUILDX_NO_DEFAULT_LOAD="$no_load" BUILDKIT_PROGRESS=plain timeout --verbose --signal=TERM --kill-after=30s 10m python tests/gateway/e2e/build_overlay.py --base-ref "$BASE_REF" --tag ovgw-e2e:local
            build_status=$?
            printf 'build_exit=%s\n' "$build_status"
            if (( build_status != 0 )); then return "$build_status"; fi
            if [[ "$phase" == no-export ]]; then
              image_absent
            else
              timeout --kill-after=1s 5s docker image inspect --format '{{.Os}}/{{.Architecture}}' ovgw-e2e:local || return "$?"
              timeout --kill-after=1s 30s docker run --rm --network none --entrypoint python ovgw-e2e:local -I -c "import redis; from openviking_gateway.config import GatewayConfig; assert 'storage' in GatewayConfig.model_fields; from pathlib import Path; import openviking_gateway; assert list((Path(openviking_gateway.__file__).parent / 'lua').glob('*.lua'))"
            fi
          }
          bash "$snapshot" 2>&1 | tee "$diag/$phase-health.log"
          setsid bash -c 'while sleep 30; do bash "$1"; done | tee -a "$2"' runner-sampler "$snapshot" "$diag/$phase-health.log" &
          sampler=$!
          cleanup() {
            kill "$sampler" 2>/dev/null || true
            kill -- "-$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          set +e
          run_build 2>&1 | tee "$diag/$phase-build.log"
          statuses=("${PIPESTATUS[@]}")
          cleanup
          trap - EXIT
          phase_status=${statuses[0]}
          if (( phase_status == 0 && statuses[1] == 0 )) && [[ "$phase" == no-export ]]; then
            grep -Eq '^#[0-9]+ exporting (to image|layers)([[:space:]]|$)' "$diag/$phase-build.log"
            export_status=$?
            if (( export_status == 0 )); then
              echo 'Phase A unexpectedly entered the image exporter' >&2
              phase_status=1
            elif (( export_status != 1 )); then
              phase_status=$export_status
            fi
          fi
          bash "$snapshot" full > "$diag/$phase-after.txt" 2>&1
          after_status=$?
          cat "$diag/$phase-after.txt"
          if (( phase_status == 0 && statuses[1] != 0 )); then phase_status=${statuses[1]}; fi
          if (( phase_status == 0 && after_status != 0 )); then phase_status=$after_status; fi
          printf 'phase_exit=%s\nlog_exit=%s\nsnapshot_exit=%s\n' "$phase_status" "${statuses[1]}" "$after_status" | tee "$diag/$phase-exit.txt"
          metadata_status=$?
          if (( phase_status != 0 )); then exit "$phase_status"; fi
          exit "$metadata_status"
          BUILD
      - name: Upload runner baseline
        if: github.event_name == 'workflow_dispatch' && inputs.overlay
        uses: actions/upload-artifact@v4
        with:
          name: runner-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ovgw-runner-diagnostics/runner-baseline.txt
          if-no-files-found: error
      - name: Phase A - build without image export
        id: phase_a
        if: github.event_name == 'workflow_dispatch' && inputs.overlay
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: bash "$RUNNER_TEMP/ovgw-runner-diagnostics/run-overlay.sh" no-export
      - name: Preserve phase A evidence before export
        id: upload_phase_a
        if: always() && github.event_name == 'workflow_dispatch' && inputs.overlay && steps.phase_a.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: runner-no-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ovgw-runner-diagnostics/no-export-*.log
            ${{ runner.temp }}/ovgw-runner-diagnostics/no-export-*.txt
          if-no-files-found: error
      - name: Phase B - export the cached overlay
        id: phase_b
        if: >-
          success() && github.event_name == 'workflow_dispatch' && inputs.overlay
          && steps.phase_a.outcome == 'success' && steps.upload_phase_a.outcome == 'success'
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: bash "$RUNNER_TEMP/ovgw-runner-diagnostics/run-overlay.sh" export
      - name: Preserve phase B evidence
        id: upload_phase_b
        if: always() && github.event_name == 'workflow_dispatch' && inputs.overlay && steps.phase_b.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: runner-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ovgw-runner-diagnostics/export-*.log
            ${{ runner.temp }}/ovgw-runner-diagnostics/export-*.txt
          if-no-files-found: error
      - name: Load test images
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker image inspect "$OV_TEST_GATEWAY_IMAGE" >/dev/null 2>&1 || docker pull "$OV_TEST_GATEWAY_IMAGE"
          docker pull redis:7.2-alpine
          python tests/gateway/e2e/load_images.py --cluster ovgw-e2e "$OV_TEST_GATEWAY_IMAGE" redis:7.2-alpine
      - name: Run standalone and Cluster matrices
        if: github.event_name != 'workflow_dispatch'
        run: pytest tests/gateway/e2e --confcutdir=tests/gateway/e2e -o addopts='' -v --basetemp=artifacts/pytest --junitxml=artifacts/results.xml
      - name: Collect cluster evidence
        if: always() && github.event_name != 'workflow_dispatch'
        run: |
          kind export logs artifacts/kind --name ovgw-e2e || true
          kubectl --kubeconfig "$OV_TEST_KIND_KUBECONFIG" get pods -A -o wide > artifacts/pods.txt || true
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'workflow_dispatch'
        with:
          name: gateway-kind-evidence
          path: artifacts
